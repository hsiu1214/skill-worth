name: Action self-test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # 真能跑的 skill：必须通过
  passes-on-real-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the action against a real skill
        id: check
        uses: ./
        with:
          path: ./tests/fixtures/good
          fail-on: skip

      - name: Assert outputs
        run: |
          echo "total=${{ steps.check.outputs.total }} skip=${{ steps.check.outputs.skip }}"
          test "${{ steps.check.outputs.total }}" = "1"
          test "${{ steps.check.outputs.skip }}" = "0"
          test -f "${{ steps.check.outputs.report }}"

  # 空壳：必须让构建失败——这里用包装确认「确实失败了」
  fails-on-empty-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the action against an empty skill (expected to fail)
        id: expect_fail
        continue-on-error: true
        uses: ./
        with:
          path: ./tests/fixtures/hollow
          fail-on: skip

      - name: Assert it failed for the right reason
        run: |
          if [ "${{ steps.expect_fail.outcome }}" != "failure" ]; then
            echo "::error::the action passed on an empty skill — that is a bug"
            exit 1
          fi
          echo "correctly failed on an empty skill"
