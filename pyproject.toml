[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-worth"
version = "1.0.1"
description = "Find AI agent skills that look useful but do nothing. Static analysis for empty SKILL.md, template filler, and unimplemented claims."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "hsiu1214" }]
keywords = [
    "ai-agents",
    "ai-agent-skills",
    "claude-skills",
    "skill-audit",
    "static-analysis",
    "linter",
    "code-quality",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/hsiu1214/skill-worth"
Repository = "https://github.com/hsiu1214/skill-worth"
Issues = "https://github.com/hsiu1214/skill-worth/issues"
Changelog = "https://github.com/hsiu1214/skill-worth/releases"

[project.scripts]
skill-worth = "skill_worth.cli:main"

[tool.setuptools]
packages = ["skill_worth"]
include-package-data = true

[tool.setuptools.package-data]
skill_worth = ["assets/*.html", "assets/*.css"]
