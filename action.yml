name: skill-worth
description: >-
  Check whether AI agent skills actually do what they claim. Finds skills that
  are safe but empty: template filler, unimplemented claims, dead file references.
author: hsiu1214

branding:
  icon: check-circle
  color: blue

inputs:
  path:
    description: >-
      A single skill folder, or a directory containing several skill folders.
      Defaults to the repository root.
    required: false
    default: "."
  fail-on:
    description: >-
      Fail the job when this verdict appears: never | skip | depends.
      Default skip — meaning any skill that does nothing fails the build.
    required: false
    default: "skip"
  report:
    description: Where to write the HTML report.
    required: false
    default: "skill-worth-report.html"
  python-version:
    description: Python version to run under.
    required: false
    default: "3.12"

outputs:
  total:
    description: How many skills were scanned.
    value: ${{ steps.check.outputs.total }}
  worth:
    description: How many were judged "worth installing".
    value: ${{ steps.check.outputs.worth }}
  skip:
    description: How many were judged "skip" (empty).
    value: ${{ steps.check.outputs.skip }}
  report:
    description: Path to the generated HTML report.
    value: ${{ steps.check.outputs.report }}
  json:
    description: Path to the raw scan JSON.
    value: ${{ steps.check.outputs.json }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install skill-worth
      shell: bash
      run: python -m pip install --quiet --disable-pip-version-check "${{ github.action_path }}"

    - name: Check skills
      id: check
      shell: bash
      env:
        SW_PATH: ${{ inputs.path }}
        SW_FAIL_ON: ${{ inputs.fail-on }}
        SW_REPORT: ${{ inputs.report }}
      run: |
        set +e
        skill-worth check "$SW_PATH" --out "$SW_REPORT" --json skill-worth.json \
          --fail-on "$SW_FAIL_ON"
        code=$?
        set -e

        python -c "
        import json, os
        d = json.load(open('skill-worth.json', encoding='utf-8'))
        t = d['totals']
        out = os.environ.get('GITHUB_OUTPUT')
        if out:
            with open(out, 'a', encoding='utf-8') as f:
                f.write('total=%d\n' % t['count'])
                f.write('worth=%d\n' % t['worth'])
                f.write('skip=%d\n' % t['skip'])
                f.write('report=%s\n' % os.environ.get('SW_REPORT', ''))
                f.write('json=skill-worth.json\n')
        "

        exit $code

    - name: Write job summary
      if: always()
      shell: bash
      run: |
        python -c "
        import json, os
        try:
            d = json.load(open('skill-worth.json', encoding='utf-8'))
        except Exception:
            raise SystemExit(0)
        t = d['totals']
        rows = []
        for s in sorted(d['skills'], key=lambda x: x['score'])[:15]:
            why = (s['reasons'][0] if s['reasons'] else '')[:70]
            rows.append('| %s | %d | %s | %s |' % (s['name'], s['score'], s['verdict'], why))
        md = '\n'.join([
            '### skill-worth',
            '',
            '**%d skills** — %d worth, %d need judgement, **%d empty**'
            % (t['count'], t['worth'], t['depends'], t['skip']),
            '',
            '| skill | score | verdict | reason |',
            '|---|---|---|---|',
        ] + rows)
        p = os.environ.get('GITHUB_STEP_SUMMARY')
        if p:
            with open(p, 'a', encoding='utf-8') as f:
                f.write(md + '\n')
        "
